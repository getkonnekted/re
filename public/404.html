<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for deep links on static servers
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      if (pathname.indexOf('/aujoten') !== -1) {
        window.location.replace('/?page=aujoten' + (hash ? hash : ''));
      } else {
        window.location.replace('/' + search + hash);
      }
    </script>
  </head>
  <body style="background-color: #071120; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to requested page...</p>
  </body>
</html>
